services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: widgetuser
      POSTGRES_PASSWORD: widgetpass
      POSTGRES_DB: widgetdb
    ports:
      - "5433:5432"
    volumes:
      - widget_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widgetuser -d widgetdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  widget_pgdata:
